<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYALTY</title>
<script>
  // Se uma página de partilha ainda não foi gerada, leva à página certa na mesma
  (function(){
    var base = location.pathname.replace(/\/(c|p)\/[\d-]+\.html$/, '/');
    var m = location.pathname.match(/\/c\/(\d+)-(\d+)\.html$/);
    if(m){ location.replace(base + 'colecao.html?id=' + m[1] + '#peca-' + m[2]); return; }
    m = location.pathname.match(/\/c\/(\d+)\.html$/);
    if(m){ location.replace(base + 'colecao.html?id=' + m[1]); return; }
    m = location.pathname.match(/\/p\/(\d+)\.html$/);
    if(m){ location.replace(base + 'loja.html?produto=' + m[1]); return; }
    location.replace(location.pathname.replace(/[^\/]*$/, '') + 'index.html');
  })();
</script>
</head>
<body><p>A abrir… <a href="index.html">Ir para a loja</a></p></body>
</html>
