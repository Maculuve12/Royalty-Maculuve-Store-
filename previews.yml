name: Atualizar pré-visualizações de partilha

on:
  workflow_dispatch:          # botão "Run workflow" (manual)
  schedule:
    - cron: '0 */3 * * *'     # e automaticamente de 3 em 3 horas

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/gerar-previews.mjs
      - name: Guardar alterações
        run: |
          git config user.name "royalty-bot"
          git config user.email "royalty-bot@users.noreply.github.com"
          git add c p
          git diff --cached --quiet || (git commit -m "Atualizar pré-visualizações de partilha" && git push)
