<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coleção | Royalty</title>
<style>
  :root{
    --white:#FFFFFF;
    --green:#142D29;
    --gold:#C8A060;
    --border:#E4E4E4;
    --placeholder-bg:#FAFAFA;
    --green-mid:#2A5049;
    --green-soft:#3D7068;
    --teal-muted:#5A7570;
    --sage:#CCDDD9;
    --off-white:#F8FAF9;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background:var(--white);
    color:var(--green);
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}

  /* ===== HEADER (mesma identidade da loja) ===== */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 5%;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    gap:16px;
  }

  nav.main-nav ul{
    display:flex;
    list-style:none;
    gap:28px;
  }

  nav.main-nav a{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:600;
    color:var(--green);
    padding-bottom:4px;
    border-bottom:2px solid transparent;
  }

  nav.main-nav a.active{
    border-bottom-color:var(--gold);
  }

  .header-row2{
    display:flex;
    align-items:center;
    gap:24px;
  }

  .logo{
    font-size:22px;
    font-weight:700;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--green);
  }

  .header-icons{
    display:flex;
    align-items:center;
    gap:20px;
  }

  .header-icons .icon{
    width:20px;
    height:20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  .icon-right-group{
    display:contents;
  }

  .icon-search{order:1;}
  .icon-account{order:2;}
  .cart-count{order:3;}

  .cart-count{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }

  .cart-count .badge{
    background:var(--gold);
    color:var(--white);
    font-size:10px;
    width:16px;
    height:16px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  @media (max-width:600px){
    header{padding:16px 4%;gap:10px;}
    nav.main-nav{width:100%;}
    nav.main-nav ul{gap:20px;width:100%;justify-content:center;}
    nav.main-nav a{font-size:7px;letter-spacing:0.2px;padding-bottom:5px;}
    .header-row2{
      position:relative;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .logo{
      font-size:16px;
      letter-spacing:2px;
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
    }
    .header-icons{display:contents;}
    .icon-account{order:1;}
    .icon-right-group{display:flex;align-items:center;gap:14px;order:2;}
  }

  /* ===== HERO DA COLEÇÃO ===== */
  .colecao-hero{
    text-align:center;
    padding:48px 6% 36px;
    background:var(--sage);
  }

  .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
  }

  .colecao-hero h1{
    font-size:26px;
    font-weight:400;
    color:var(--green);
    margin-bottom:14px;
  }

  .colecao-hero p{
    font-size:13px;
    line-height:1.8;
    color:var(--teal-muted);
    max-width:520px;
    margin:0 auto;
  }

  /* ===== PEÇAS ===== */
  .pecas-lista{
    max-width:560px;
    margin:0 auto;
    padding:36px 5% 70px;
    display:flex;
    flex-direction:column;
    gap:48px;
  }

  .peca-vazio, .peca-erro{
    text-align:center;
    color:var(--teal-muted);
    font-size:13px;
    padding:60px 0;
  }

  .peca-bloco{ display:flex; flex-direction:column; }

  .peca-intro{
    font-size:14px;
    line-height:1.8;
    color:var(--green);
    font-style:italic;
    margin-bottom:16px;
  }

  .peca-media{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:var(--placeholder-bg);
    overflow:hidden;
  }

  .peca-track{
    display:flex;
    width:100%;
    height:100%;
    transition:transform .3s ease;
  }

  .peca-slide{
    width:100%;
    height:100%;
    flex-shrink:0;
  }

  .peca-slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .peca-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:28px;
    height:28px;
    border-radius:50%;
    background:rgba(255,255,255,0.85);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    line-height:1;
    color:var(--green);
    cursor:pointer;
    padding:0;
    z-index:2;
  }

  .peca-arrow.prev{left:10px;}
  .peca-arrow.next{right:10px;}

  .peca-dots{
    position:absolute;
    bottom:12px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:5px;
    z-index:2;
  }

  .peca-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:rgba(255,255,255,0.75);
  }

  .peca-dot.active{
    background:var(--gold);
  }

  .peca-desc{
    padding:16px 2px;
    font-size:13px;
    line-height:1.8;
    color:var(--teal-muted);
    white-space:pre-line;
  }

  .peca-btn{
    display:inline-block;
    align-self:flex-start;
    padding:13px 30px;
    background:var(--green);
    color:var(--white);
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-top:4px;
  }

  /* ===== FOOTER (mesma identidade da loja) ===== */
  footer{
    padding:32px 5% 24px;
    border-top:1px solid var(--border);
  }

  .footer-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    margin-bottom:28px;
  }

  .footer-link{
    font-size:12px;
    color:var(--teal-muted);
  }

  .social-icons{
    display:flex;
    gap:10px;
  }

  .social-icon{
    width:24px;
    height:24px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:var(--green-mid);
  }

  .social-icon svg{
    width:12px;
    height:12px;
  }

  .copyright{
    text-align:center;
    font-size:12px;
    color:var(--teal-muted);
    padding-top:20px;
    border-top:1px solid var(--border);
  }

</style>

<script>
  const SB_URL = 'https://zrcnwkrvfkykqnhwoklh.supabase.co';
  const SB_KEY = 'sb_publishable_PX2HcOTmRmbHLDOT5YuKjg_KBNB6aZc';

  const pecaImgs = {};

  async function carregarColecao(){
    const id = new URLSearchParams(window.location.search).get('id');
    const listaEl = document.getElementById('pecas-lista');
    if(!id){
      document.getElementById('colecao-nome').textContent = 'Coleção não encontrada';
      listaEl.innerHTML = '<p class="peca-erro">Falta indicar qual coleção mostrar.</p>';
      return;
    }

    try{
      const colData = await fetch(`${SB_URL}/rest/v1/colecoes?id=eq.${id}&select=id,nome,descricao`, {
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
      }).then(r => r.json());

      if(!colData || !colData.length){
        document.getElementById('colecao-nome').textContent = 'Coleção não encontrada';
        listaEl.innerHTML = '<p class="peca-erro">Esta coleção já não está disponível.</p>';
        return;
      }
      const colecao = colData[0];
      document.title = `${colecao.nome} | Royalty`;
      document.getElementById('colecao-nome').textContent = colecao.nome;
      document.getElementById('colecao-intro').textContent = colecao.descricao || '';

      const pecas = await fetch(`${SB_URL}/rest/v1/colecoes_pecas?colecao_id=eq.${id}&order=ordem.asc&select=id,intro,imagens,descricao,produto_id`, {
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
      }).then(r => r.json());

      if(!pecas || !pecas.length){
        listaEl.innerHTML = '<p class="peca-vazio">Ainda não há peças nesta coleção.</p>';
        return;
      }

      const idsProdutos = [...new Set(pecas.map(p => p.produto_id).filter(Boolean))];
      let produtosPorId = {};
      if(idsProdutos.length){
        const prods = await fetch(`${SB_URL}/rest/v1/produtos?id=in.(${idsProdutos.join(',')})&select=id,nome,preco`, {
          headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
        }).then(r => r.json()).catch(() => []);
        (prods||[]).forEach(p => { produtosPorId[p.id] = p; });
      }

      listaEl.innerHTML = pecas.map(peca => {
        const imgs = Array.isArray(peca.imagens) ? peca.imagens : [];
        pecaImgs[peca.id] = imgs;
        const produto = produtosPorId[peca.produto_id];
        const label = produto ? `Comprar — ${produto.nome}` : 'Comprar';
        const link = peca.produto_id ? `loja.html?produto=${peca.produto_id}` : 'loja.html';
        return `
          <div class="peca-bloco">
            ${peca.intro ? `<p class="peca-intro">${peca.intro}</p>` : ''}
            <div class="peca-media" id="peca-media-${peca.id}">
              <div class="peca-track" id="peca-track-${peca.id}">
                ${imgs.map(img => `<div class="peca-slide"><img src="${img}" alt="${produto ? produto.nome : 'Peça da coleção'}" loading="lazy"></div>`).join('')}
              </div>
              ${imgs.length > 1 ? `
                <button class="peca-arrow prev" onclick="pecaPrev(${peca.id})">&#8249;</button>
                <button class="peca-arrow next" onclick="pecaNext(${peca.id})">&#8250;</button>
                <div class="peca-dots" id="peca-dots-${peca.id}">
                  ${imgs.map((_, i) => `<span class="peca-dot ${i === 0 ? 'active' : ''}"></span>`).join('')}
                </div>
              ` : ''}
            </div>
            ${peca.descricao ? `<div class="peca-desc">${peca.descricao}</div>` : ''}
            <a class="peca-btn" href="${link}">${label}</a>
          </div>
        `;
      }).join('');

      pecas.forEach(peca => {
        const media = document.getElementById(`peca-media-${peca.id}`);
        if(!media || !pecaImgs[peca.id] || pecaImgs[peca.id].length <= 1) return;
        let startX = 0;
        media.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive:true });
        media.addEventListener('touchend', e => {
          const diff = e.changedTouches[0].clientX - startX;
          if(Math.abs(diff) > 40){ diff < 0 ? pecaNext(peca.id) : pecaPrev(peca.id); }
        }, { passive:true });
      });
    }catch(e){
      console.error('Erro ao carregar a coleção:', e);
      listaEl.innerHTML = '<p class="peca-erro">Não foi possível carregar esta coleção.</p>';
    }
  }

  function moverPecaSlide(id, idx){
    const imgs = pecaImgs[id];
    if(!imgs || imgs.length <= 1) return;
    if(idx >= imgs.length) idx = 0;
    if(idx < 0) idx = imgs.length - 1;
    const track = document.getElementById(`peca-track-${id}`);
    if(track) track.style.transform = `translateX(-${idx * 100}%)`;
    document.querySelectorAll(`#peca-dots-${id} .peca-dot`).forEach((d, i) => d.classList.toggle('active', i === idx));
    if(track) track.dataset.idx = idx;
  }

  function pecaNext(id){
    const track = document.getElementById(`peca-track-${id}`);
    const atual = track ? Number(track.dataset.idx || 0) : 0;
    moverPecaSlide(id, atual + 1);
  }
  function pecaPrev(id){
    const track = document.getElementById(`peca-track-${id}`);
    const atual = track ? Number(track.dataset.idx || 0) : 0;
    moverPecaSlide(id, atual - 1);
  }

  function marcarLinkActivo(){
    const pagina = document.body.dataset.page || '';
    document.querySelectorAll('.main-nav a').forEach(a => {
      a.classList.toggle('active', a.dataset.page === pagina);
    });
  }

  marcarLinkActivo();
  carregarColecao();
</script>
