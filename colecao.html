<style>
  :root{
    --white:#FFFFFF;
    --green:#142D29;
    --gold:#C8A060;
    --border:#E4E4E4;
    --placeholder-bg:#FAFAFA;
    --green-mid:#2A5049;
    --green-soft:#3D7068;
    --teal-muted:#5A7570;
    --sage:#CCDDD9;
    --off-white:#F8FAF9;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background:var(--white);
    color:var(--green);
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}

  /* ===== HEADER ===== */
  header{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    height:64px;
    padding:0 3%;
    border-bottom:1px solid var(--border);
    background:var(--white);
  }
  .topo-esq{ display:flex; align-items:center; gap:2px; justify-self:start; }
  .topo-dir{ display:flex; align-items:center; gap:2px; justify-self:end; }
  .topo-btn{
    position:relative;
    width:42px;
    height:42px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:0;
    padding:0;
    cursor:pointer;
    color:var(--green);
  }
  .topo-btn svg{
    width:23px;
    height:23px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .logo{
    font-size:20px;
    font-weight:700;
    letter-spacing:5px;
    padding-left:5px;
    color:var(--green);
    text-align:center;
    white-space:nowrap;
  }
  .cart-count .badge{
    position:absolute;
    top:2px;
    right:0;
    min-width:17px;
    height:17px;
    padding:0 4px;
    border-radius:9px;
    background:var(--gold);
    color:var(--white);
    font-size:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  @media (max-width:600px){
    .logo{ font-size:17px; letter-spacing:3.5px; padding-left:3.5px; }
  }

  /* ===== MENU LATERAL ===== */
  .menu-fundo{
    position:fixed;
    inset:0;
    background:rgba(20,45,41,0.45);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:690;
  }
  .menu-fundo.open{ opacity:1; pointer-events:auto; }
  .menu-gaveta{
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    width:min(84%, 340px);
    background:var(--white);
    transform:translateX(-100%);
    transition:transform .28s ease;
    z-index:700;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  .menu-gaveta.open{ transform:translateX(0); }
  .menu-topo{ display:flex; justify-content:flex-end; padding:14px 14px 6px; }
  .menu-fechar{
    width:42px;
    height:42px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:0;
    padding:0;
    cursor:pointer;
    color:var(--green);
  }
  .menu-fechar svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }
  .menu-lista{ display:flex; flex-direction:column; padding:8px 0 40px; }
  .menu-lista > a, .menu-item-botao{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:17px 30px;
    background:none;
    border:0;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--green);
    text-align:left;
    cursor:pointer;
  }
  .menu-lista > a.active{ box-shadow:inset 2px 0 0 var(--gold); }
  .menu-item-botao svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s ease; }
  .menu-grupo.aberto .menu-item-botao svg{ transform:rotate(180deg); }
  .menu-sub{ display:none; flex-direction:column; padding-bottom:8px; }
  .menu-grupo.aberto .menu-sub{ display:flex; }
  .menu-sub a{
    padding:12px 30px 12px 46px;
    font-size:13px;
    letter-spacing:1.5px;
    color:var(--teal-muted);
  }

  /* ===== TOPO DA COLEÇÃO ===== */
  .colecao-topo, .colecao-texto{ max-width:560px; margin:0 auto; padding-left:5%; padding-right:5%; }
  .colecao-topo{ padding-top:28px; }

  .colecao-topo h1{ text-align:center; }
  .colecao-intro{ text-align:center; }
  .colecao-acoes{ display:flex; justify-content:center; margin-top:30px; }
  .btn-partilhar-caixa{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:13px 24px;
    background:none;
    border:1px solid var(--green);
    color:var(--green);
    font-family:inherit;
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .btn-partilhar-caixa svg{
    width:16px;
    height:16px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .colecao-topo h1{
    font-family:'Playfair Display',Georgia,serif;
    font-variant-numeric:lining-nums;
    font-feature-settings:'lnum';
    font-size:28px;
    font-weight:600;
    line-height:1.25;
    color:var(--green);
  }

  .colecao-texto{ padding-top:16px; }
  .colecao-intro p{
    font-size:14.5px;
    line-height:1.75;
    color:var(--teal-muted);
    margin:0 0 14px;
  }
  .colecao-intro p:last-child{ margin-bottom:0; }
  .colecao-intro strong{ font-weight:700; color:var(--green); }

  /* ===== FOTOS: arrastar para o lado, sem cortar ===== */
  .contador{
    position:absolute;
    top:10px;
    right:10px;
    background:var(--green);
    color:var(--white);
    font-size:11px;
    font-weight:600;
    letter-spacing:1px;
    padding:4px 9px;
    border-radius:2px;
    pointer-events:none;
  }
  .pontos{ display:flex; justify-content:center; gap:6px; padding-top:12px; }
  .ponto{ width:5px; height:5px; border-radius:50%; background:var(--border); transition:background .2s ease; }
  .ponto.activo{ background:var(--gold); }

  .colecao-galeria{ display:none; max-width:560px; margin:0 auto; padding:24px 5% 0; }
  .colecao-galeria-media, .peca-media{ position:relative; width:100%; }

  .colecao-galeria-track, .peca-track{
    display:flex;
    gap:6px;
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    overscroll-behavior-x:contain;
    cursor:grab;
  }
  .colecao-galeria-track::-webkit-scrollbar, .peca-track::-webkit-scrollbar{ display:none; }
  .colecao-galeria-track.arrastando, .peca-track.arrastando{ cursor:grabbing; scroll-snap-type:none; }

  .colecao-galeria-slide, .peca-slide{
    flex:0 0 100%;
    scroll-snap-align:start;
    aspect-ratio:var(--prop, 3/4);
    background:var(--off-white);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .colecao-galeria-multi .colecao-galeria-slide, .peca-multi .peca-slide{ flex-basis:90%; }
  .colecao-galeria-multi .colecao-galeria-track, .peca-multi .peca-track{ padding-right:10%; box-sizing:border-box; }

  .colecao-galeria-slide img, .peca-slide img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none;
    user-select:none;
    -webkit-user-drag:none;
  }

  /* ===== PEÇAS ===== */
  .pecas-lista{
    max-width:560px;
    margin:0 auto;
    padding:32px 5% 56px;
    display:flex;
    flex-direction:column;
    gap:44px;
  }

  .peca-vazio, .peca-erro{
    text-align:center;
    color:var(--teal-muted);
    font-size:13px;
    padding:60px 0;
  }

  .peca-bloco{ display:flex; flex-direction:column; }

  .peca-titulo{
    font-family:'Playfair Display',Georgia,serif;
    font-variant-numeric:lining-nums;
    font-feature-settings:'lnum';
    font-size:22px;
    font-weight:600;
    line-height:1.3;
    color:var(--green);
    margin-bottom:14px;
  }

  /* partilhar: ícone fino e discreto */
  .btn-partilhar-ico{
    flex:0 0 auto;
    width:36px;
    height:36px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:0;
    padding:0;
    margin:0 -8px 0 0;
    color:var(--green);
    cursor:pointer;
  }
  .btn-partilhar-ico svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  /* texto da peça: recolhido por defeito, com "Ver mais" */
  .peca-detalhes{ margin-top:18px; }
  .peca-detalhes > * + *{ margin-top:14px; }
  .peca-lead{
    font-family:'Playfair Display',Georgia,serif;
    font-variant-numeric:lining-nums;
    font-feature-settings:'lnum';
    font-size:17px;
    font-weight:500;
    line-height:1.5;
    color:var(--green-mid);
  }
  .peca-corpo p{
    font-size:14.5px;
    line-height:1.75;
    color:var(--teal-muted);
    margin:0 0 14px;
    font-style:normal;
  }
  .peca-corpo p:last-child{ margin-bottom:0; }
  .peca-fecho{
    font-family:'Playfair Display',Georgia,serif;
    font-variant-numeric:lining-nums;
    font-feature-settings:'lnum';
    font-size:16px;
    line-height:1.7;
    color:var(--green);
  }
  .peca-desc{
    white-space:pre-line;
    font-size:14px;
    line-height:1.75;
    color:var(--teal-muted);
  }
  .peca-corpo strong, .peca-lead strong, .peca-fecho strong, .peca-desc strong{ font-weight:700; color:var(--green); }

  .peca-detalhes.recolhido > :not(.peca-lead):not(.peca-corpo):not(.peca-desc:first-child){ display:none; }
  .peca-detalhes.recolhido .peca-corpo p:not(:first-child){ display:none; }
  .peca-detalhes.recolhido .peca-corpo p:first-child{ margin-bottom:0; }
  .peca-detalhes.recolhido .peca-corpo p:first-child,
  .peca-detalhes.recolhido > .peca-desc:first-child{
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .peca-acoes{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
  }
  .peca-acoes .btn-partilhar-ico{ margin-left:auto; }
  .peca-mais{
    background:none;
    border:0;
    padding:0 0 3px;
    font-family:inherit;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:700;
    color:var(--green);
    border-bottom:1px solid var(--gold);
    cursor:pointer;
  }

  /* comprar: nome e preço à esquerda, botão à direita */
  .peca-compra{
    margin-top:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .peca-compra-nome{ font-size:14px; font-weight:600; line-height:1.3; color:var(--green); }
  .peca-compra-preco{ margin-top:3px; font-size:14px; font-weight:700; color:var(--green); }
  .peca-compra-acoes{ display:flex; align-items:center; gap:10px; margin-left:auto; }
  .peca-btn{
    background:var(--green);
    color:var(--white);
    padding:13px 22px;
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    white-space:nowrap;
  }


  /* ===== FOOTER (mesma identidade da loja) ===== */
  footer{
    padding:32px 5% 24px;
    border-top:1px solid var(--border);
  }

  .footer-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    margin-bottom:28px;
  }

  .footer-link{
    font-size:12px;
    color:var(--teal-muted);
  }

  .social-icons{
    display:flex;
    gap:10px;
  }

  .social-icon{
    width:24px;
    height:24px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:var(--green-mid);
  }

  .social-icon svg{
    width:12px;
    height:12px;
  }

  .copyright{
    text-align:center;
    font-size:12px;
    color:var(--teal-muted);
    padding-top:20px;
    border-top:1px solid var(--border);
  }

  .menu-etiqueta{
    margin-left:10px;
    font-size:10px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
  }
  .menu-grupo.ativo > .menu-item-botao{ box-shadow:inset 2px 0 0 var(--gold); }
</style>

<script>
  // Texto livre: escapa HTML, converte **frase** em negrito (quebras de linha via CSS pre-line)
  function formatarTexto(txt){
    return String(txt == null ? '' : txt)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>');
  }

  // Estrutura o texto da peça: título, frase de abertura, corpo e frase final
  function formatarIntroPeca(txt){
    const paras = String(txt == null ? '' : txt).replace(/\r/g,'').trim().split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    if(!paras.length) return '';
    const plano = p => p.replace(/\*\*/g,'');
    const fmt = p => formatarTexto(p).replace(/\n/g,'<br>');
    let i = 0, html = '';
    if(paras.length > 1 && plano(paras[0]).length <= 40){ html += `<div class="peca-titulo">${fmt(paras[0])}</div>`; i = 1; }
    if(i === 1 && paras.length - i >= 2 && plano(paras[i]).length <= 90){ html += `<div class="peca-lead">${fmt(paras[i])}</div>`; i++; }
    let corpo = paras.slice(i);
    let fecho = '';
    if(corpo.length >= 3){ fecho = corpo.pop(); }
    html += `<div class="peca-corpo">${corpo.map(p => `<p>${fmt(p)}</p>`).join('')}</div>`;
    if(fecho) html += `<div class="peca-fecho">${fmt(fecho)}</div>`;
    return html;
  }

  // ─── Partilha (WhatsApp / menu de partilha do telemóvel) ───
  const SITE_BASE = 'https://maculuve12.github.io/Royalty-Maculuve-Store-/';

  function resumoCurto(txt, max){
    let t = String(txt || '').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
    if(t.length > max){ t = t.slice(0, max).replace(/\s+\S*$/, '') + '…'; }
    return t;
  }
  function partilhar(titulo, texto, url){

      navigator.share({ title: titulo, text: texto, url: url }).catch(() => {});

    }

  }

  const SB_URL = 'https://zrcnwkrvfkykqnhwoklh.supabase.co';
  const SB_KEY = 'sb_publishable_PX2HcOTmRmbHLDOT5YuKjg_KBNB6aZc';

  const pecaImgs = {};

  // Slider de fotos: arrastar, sem cortar, com contador e pontos
  function iniciarSlider(track, contador, pontos, minimo){
    const imgs = track.querySelectorAll('img');
    const total = imgs.length;
    if(!total) return;
    const primeira = imgs[0];
    const ajustar = () => {
      if(!primeira.naturalWidth) return;
      const r = Math.min(1.5, Math.max(minimo, primeira.naturalWidth / primeira.naturalHeight));
      track.style.setProperty('--prop', r.toFixed(3));
    };
    if(primeira.complete) ajustar(); else primeira.addEventListener('load', ajustar);
    if(total < 2) return;

    const slides = track.children;
    const passo = () => slides[1].offsetLeft - slides[0].offsetLeft;
    const actualizar = () => {
      let idx = Math.round(track.scrollLeft / passo());
      if(track.scrollLeft >= track.scrollWidth - track.clientWidth - 2) idx = total - 1;
      idx = Math.max(0, Math.min(total - 1, idx));
      if(contador) contador.textContent = `${idx + 1} / ${total}`;
      pontos.forEach((d, i) => d.classList.toggle('activo', i === idx));
    };
    track.addEventListener('scroll', actualizar, { passive:true });

    // rato no computador; no telemóvel o toque já arrasta nativamente
    let down = false, x0 = 0, s0 = 0;
    track.addEventListener('pointerdown', e => {
      if(e.pointerType !== 'mouse') return;
      down = true; x0 = e.clientX; s0 = track.scrollLeft;
    });
    window.addEventListener('pointermove', e => {
      if(!down) return;
      const dx = e.clientX - x0;
      if(Math.abs(dx) > 4) track.classList.add('arrastando');
      track.scrollLeft = s0 - dx;
    });
    window.addEventListener('pointerup', () => {
      if(!down) return;
      down = false;
      track.classList.remove('arrastando');
      track.scrollTo({ left: Math.round(track.scrollLeft / passo()) * passo(), behavior:'smooth' });
    });
  }


  // "Ver mais / Ver menos": só aparece se o texto tiver mais do que o início visível
  function ajustarVerMaisPecas(pecas){
    pecas.forEach(peca => {
      const det = document.getElementById(`peca-det-${peca.id}`);
      const btn = document.getElementById(`peca-mais-${peca.id}`);
      if(!det || !btn) return;
      const aberto = !det.classList.contains('recolhido');
      det.classList.remove('recolhido');
      const alturaCheia = det.offsetHeight;
      det.classList.add('recolhido');
      const alturaCurta = det.offsetHeight;
      if(alturaCheia - alturaCurta < 4){
        det.classList.remove('recolhido');
        btn.style.display = 'none';
      } else {
        btn.style.display = '';
        if(aberto) det.classList.remove('recolhido');
      }
    });
  }

  function alternarPeca(id){
    const det = document.getElementById(`peca-det-${id}`);
    const btn = document.getElementById(`peca-mais-${id}`);
    if(!det || !btn) return;
    const fechado = det.classList.toggle('recolhido');
    btn.textContent = fechado ? 'Ver mais' : 'Ver menos';
  }

  // Galeria da coleção: capa + imagens adicionais (só aparece se houver imagens adicionais)
  function montarGaleriaColecao(colecao){
    const extras = Array.isArray(colecao.imagens) ? colecao.imagens.filter(Boolean) : [];
    if(!extras.length && colecao.estado !== 'em_breve') return;
    const imgs = [colecao.imagem_capa, ...extras].filter(Boolean);
    const multi = imgs.length > 1;
    const box = document.getElementById('colecao-galeria');
    box.innerHTML = `
      <div class="colecao-galeria-media${multi ? ' colecao-galeria-multi' : ''}">
        <div class="colecao-galeria-track" id="colecao-galeria-track">
          ${imgs.map(u => `<div class="colecao-galeria-slide"><img src="${u}" alt="${colecao.nome}" draggable="false" loading="lazy"></div>`).join('')}
        </div>
        ${multi ? `<div class="contador" id="colecao-galeria-cont">1 / ${imgs.length}</div>
        <div class="pontos" id="colecao-galeria-dots">${imgs.map((_,i) => `<span class="ponto ${i===0?'activo':''}"></span>`).join('')}</div>` : ''}
      </div>`;
    box.style.display = 'block';
    iniciarSlider(document.getElementById('colecao-galeria-track'), document.getElementById('colecao-galeria-cont'), document.querySelectorAll('#colecao-galeria-dots .ponto'), 0.66);
  }

  async function carregarColecao(){
    const id = new URLSearchParams(window.location.search).get('id');
    const listaEl = document.getElementById('pecas-lista');
    if(!id){
      document.getElementById('colecao-nome').textContent = 'Coleção não encontrada';
      listaEl.innerHTML = '<p class="peca-erro">Falta indicar qual coleção mostrar.</p>';
      return;
    }

    try{
      const hdr = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
      let colData = await fetch(`${SB_URL}/rest/v1/colecoes?id=eq.${id}&select=id,nome,descricao,imagem_capa,imagens,estado,data_prevista`, {headers:hdr}).then(r => r.json()).catch(() => null);
      if(!Array.isArray(colData)){
        // coluna 'imagens' ainda não existe: tenta sem ela
        colData = await fetch(`${SB_URL}/rest/v1/colecoes?id=eq.${id}&select=id,nome,descricao,imagem_capa,estado,data_prevista`, {headers:hdr}).then(r => r.json());
      }

      if(!colData || !colData.length){
        document.getElementById('colecao-nome').textContent = 'Coleção não encontrada';
        listaEl.innerHTML = '<p class="peca-erro">Esta coleção já não está disponível.</p>';
        return;
      }
      const colecao = colData[0];
      document.title = `${String(colecao.nome).replace(/\*\*/g,'')} | Royalty`;
      document.getElementById('colecao-nome').textContent = String(colecao.nome).replace(/\*\*/g,'');
      document.getElementById('colecao-intro').innerHTML = String(colecao.descricao || '').replace(/\r/g,'').trim()
        .split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
        .map(p => `<p>${formatarTexto(p).replace(/\n/g,'<br>')}</p>`).join('');
      const metaDesc = document.querySelector('meta[name="description"]');
      if(metaDesc && colecao.descricao) metaDesc.content = resumoCurto(colecao.descricao, 155);
      montarGaleriaColecao(colecao);
      colecaoAtual = colecao;
      const btnPartColecao = document.getElementById('btn-partilhar-colecao');
      btnPartColecao.style.display = 'inline-flex';

      // coleção ainda não lançada: só mostra a capa, o texto e a data prevista
      if(colecao.estado === 'em_breve'){
        const d = colecao.data_prevista ? colecao.data_prevista.split('-').reverse().join('/') : '';
        listaEl.innerHTML = `<p class="peca-vazio" style="letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--green);">Em breve${d ? ' · ' + d : ''}</p>`;
        return;
      }

      const pecas = await fetch(`${SB_URL}/rest/v1/colecoes_pecas?colecao_id=eq.${id}&order=ordem.asc&select=id,intro,imagens,descricao,produto_id`, {
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
      }).then(r => r.json());

      if(!pecas || !pecas.length){
        listaEl.innerHTML = '<p class="peca-vazio">Ainda não há peças nesta coleção.</p>';
        return;
      }

      const idsProdutos = [...new Set(pecas.map(p => p.produto_id).filter(Boolean))];
      let produtosPorId = {};
      if(idsProdutos.length){
        const prods = await fetch(`${SB_URL}/rest/v1/produtos?id=in.(${idsProdutos.join(',')})&select=id,nome,preco`, {
          headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
        }).then(r => r.json()).catch(() => []);
        (prods||[]).forEach(p => { produtosPorId[p.id] = p; });
      }

      listaEl.innerHTML = pecas.map(peca => {
        const imgs = Array.isArray(peca.imagens) ? peca.imagens : [];
        pecaImgs[peca.id] = imgs;
        const multi = imgs.length > 1;
        const produto = produtosPorId[peca.produto_id];
        const link = peca.produto_id ? `loja.html?produto=${peca.produto_id}` : 'loja.html';
        const primeiraLinha = String(peca.intro || '').replace(/\*\*/g,'').split(/\n/)[0].trim();
        const tituloPeca = (primeiraLinha && primeiraLinha.length <= 40) ? primeiraLinha : (produto ? produto.nome : 'Peça da coleção');
        const tituloPecaAttr = tituloPeca.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

        // separa o título do resto do texto; o resto (e os detalhes) ficam num bloco que abre e fecha
        let intro = peca.intro ? formatarIntroPeca(peca.intro) : '';
        let tituloHtml = '';
        const mt = intro.match(/<div class="peca-titulo">([\s\S]*?)<\/div>/);
        if(mt){
          tituloHtml = `<div class="peca-titulo">${mt[1]}</div>`;
          intro = intro.replace(mt[0], '');
        }
        const detalhes = intro + (peca.descricao ? `<div class="peca-desc">${formatarTexto(peca.descricao)}</div>` : '');

        return `
          <div class="peca-bloco" id="peca-${peca.id}">
            ${tituloHtml}
            ${imgs.length ? `
            <div class="peca-media${multi ? ' peca-multi' : ''}" id="peca-media-${peca.id}">
              <div class="peca-track" id="peca-track-${peca.id}">
                ${imgs.map(img => `<div class="peca-slide"><img src="${img}" alt="${produto ? produto.nome : 'Peça da coleção'}" draggable="false" loading="lazy"></div>`).join('')}
              </div>
              ${multi ? `<div class="contador" id="peca-cont-${peca.id}">1 / ${imgs.length}</div>
              <div class="pontos" id="peca-dots-${peca.id}">${imgs.map((_, i) => `<span class="ponto ${i === 0 ? 'activo' : ''}"></span>`).join('')}</div>` : ''}
            </div>` : ''}
            ${detalhes ? `<div class="peca-detalhes recolhido" id="peca-det-${peca.id}">${detalhes}</div>` : ''}
            ${detalhes ? `<div class="peca-acoes"><button class="peca-mais" id="peca-mais-${peca.id}" onclick="alternarPeca(${peca.id})">Ver mais</button></div>` : ''}
            <div class="peca-compra">
              ${produto ? `<div class="peca-compra-info"><div class="peca-compra-nome">${produto.nome}</div>${produto.preco != null ? `<div class="peca-compra-preco">${produto.preco} MT</div>` : ''}</div>` : ''}
              <div class="peca-compra-acoes"><a class="peca-btn" href="${link}">Ver na loja</a></div>
            </div>
          </div>
        `;
      }).join('');

      pecas.forEach(peca => {
        const track = document.getElementById(`peca-track-${peca.id}`);
        if(track) iniciarSlider(track, document.getElementById(`peca-cont-${peca.id}`), document.querySelectorAll(`#peca-dots-${peca.id} .ponto`), 0.66);
      });
      ajustarVerMaisPecas(pecas);
      if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => ajustarVerMaisPecas(pecas));

      // Link directo a uma peça (#peca-ID): desliza até ela
      if(/^#peca-\d+$/.test(location.hash)){
        setTimeout(() => {
          const alvo = document.getElementById(location.hash.slice(1));
          if(alvo) alvo.scrollIntoView({ behavior:'smooth', block:'start' });
        }, 400);
      }
    }catch(e){
      console.error('Erro ao carregar a coleção:', e);
      listaEl.innerHTML = '<p class="peca-erro">Não foi possível carregar esta coleção.</p>';
    }
  }

  // Coleções no menu: todas as que têm peças, e as "em breve" no fim
  async function carregarMenuColecoes(){
    const grupo = document.getElementById('menu-colecoes');
    if(!grupo) return;
    const hdr = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
    const esc = t => String(t).replace(/\*\*/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    try{
      const [cols, pecas, stats] = await Promise.all([
        fetch(`${SB_URL}/rest/v1/colecoes?order=ordem.asc&select=id,nome,estado`, { headers: hdr }).then(r => r.json()),
        fetch(`${SB_URL}/rest/v1/colecoes_pecas?select=colecao_id,produto_id`, { headers: hdr }).then(r => r.json()),
        fetch(`${SB_URL}/rest/v1/estatisticas_produtos?select=produto_id,total_vendas`, { headers: hdr }).then(r => r.json()).catch(() => [])
      ]);
      if(!Array.isArray(cols) || !Array.isArray(pecas)) return;
      const comPecas = new Set(pecas.map(p => p.colecao_id));

      // coleção mais vendida = soma das vendas dos produtos das suas peças
      const vendasProduto = {};
      (Array.isArray(stats) ? stats : []).forEach(x => { vendasProduto[x.produto_id] = (vendasProduto[x.produto_id] || 0) + (x.total_vendas || 0); });
      const produtosDaColecao = {};
      pecas.forEach(p => { if(p.produto_id) (produtosDaColecao[p.colecao_id] = produtosDaColecao[p.colecao_id] || new Set()).add(p.produto_id); });
      let melhorId = null, melhorTotal = 0;
      Object.keys(produtosDaColecao).forEach(cid => {
        let total = 0;
        produtosDaColecao[cid].forEach(pid => { total += vendasProduto[pid] || 0; });
        if(total > melhorTotal){ melhorTotal = total; melhorId = Number(cid); }
      });

      const disponiveis = cols.filter(c => c.estado !== 'em_breve' && comPecas.has(c.id));
      const emBreve = cols.filter(c => c.estado === 'em_breve');
      const lista = [...disponiveis, ...emBreve];
      if(!lista.length) return;
      document.getElementById('menu-sub-colecoes').innerHTML = lista.map(c =>
        `<a href="colecao.html?id=${c.id}">${esc(c.nome)}${c.estado === 'em_breve' ? '<span class="menu-etiqueta">Em breve</span>' : (c.id === melhorId ? '<span class="menu-etiqueta">Mais vendida</span>' : '')}</a>`
      ).join('');
      grupo.style.display = 'block';
      if(/colecao\.html$/i.test(location.pathname)) grupo.classList.add('ativo', 'aberto');
    }catch(e){}
  }

  async function carregarMenuCategorias(){
    const grupo = document.getElementById('menu-categorias');
    if(!grupo) return;
    const hdr = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
    const esc = t => String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    try{
      const [cats, prods] = await Promise.all([
        fetch(`${SB_URL}/rest/v1/categorias?order=ordem.asc&select=nome`, { headers: hdr }).then(r => r.json()),

      ]);
      if(!Array.isArray(cats) || !Array.isArray(prods)) return;
      const comPecas = new Set(prods.map(p => p.categoria).filter(Boolean));
      const lista = cats.filter(c => comPecas.has(c.nome));
      if(!lista.length) return;
      document.getElementById('menu-sub').innerHTML =
        '<a href="loja.html">Todas as peças</a>' +
        lista.map(c => `<a href="loja.html?categoria=${encodeURIComponent(c.nome)}">${esc(c.nome)}</a>`).join('');
      grupo.style.display = 'block';
    }catch(e){}
  }

  // Número de peças no carrinho (guardado pela loja)
  function atualizarBadgeCarrinho(){
    try{
      const c = JSON.parse(localStorage.getItem('royalty_carrinho') || '[]');
      const n = c.reduce((acc, i) => acc + (Number(i.qtd) || 0), 0);
      const b = document.getElementById('cart-badge');
      if(b) b.textContent = n;
    }catch(e){}
  }

  marcarLinkActivo();
  carregarMenuCategorias();
  carregarMenuColecoes();
  atualizarBadgeCarrinho();
  carregarColecao();
</script>

</body>
</html>
