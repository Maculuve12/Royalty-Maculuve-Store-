<style>
  :root{
    --white:#FFFFFF;
    --green:#142D29;
    --gold:#C8A060;
    --border:#E4E4E4;
    --placeholder-bg:#FAFAFA;
    --green-mid:#2A5049;
    --green-soft:#3D7068;
    --teal-muted:#5A7570;
    --sage:#CCDDD9;
    --off-white:#F8FAF9;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background:var(--white);
    color:var(--green);
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}

  /* ===== HEADER (mesma identidade da loja) ===== */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 5%;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    gap:16px;
  }

  nav.main-nav ul{
    display:flex;
    list-style:none;
    gap:28px;
  }

  nav.main-nav a{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:600;
    color:var(--green);
    padding-bottom:4px;
    border-bottom:2px solid transparent;
  }

  nav.main-nav a.active{
    border-bottom-color:var(--gold);
  }

  .header-row2{
    display:flex;
    align-items:center;
    gap:24px;
  }

  .logo{
    font-size:22px;
    font-weight:700;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--green);
  }

  .header-icons{
    display:flex;
    align-items:center;
    gap:20px;
  }

  .header-icons .icon{
    width:20px;
    height:20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  .icon-right-group{
    display:contents;
  }

  .icon-search{order:1;}
  .icon-account{order:2;}
  .cart-count{order:3;}

  .cart-count{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }

  .cart-count .badge{
    background:var(--gold);
    color:var(--white);
    font-size:10px;
    width:16px;
    height:16px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  @media (max-width:600px){
    header{padding:16px 4%;gap:10px;}
    nav.main-nav{width:100%;}
    nav.main-nav ul{gap:20px;width:100%;justify-content:center;}
    nav.main-nav a{font-size:7px;letter-spacing:0.2px;padding-bottom:5px;}
    .header-row2{
      position:relative;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .logo{
      font-size:16px;
      letter-spacing:2px;
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
    }
    .header-icons{display:contents;}
    .icon-account{order:1;}
    .icon-right-group{display:flex;align-items:center;gap:14px;order:2;}
  }

  /* ===== GALERIA DA COLEÇÃO ===== */
  .colecao-galeria{ display:none; max-width:560px; margin:0 auto; padding:24px 5% 0; }
  .colecao-galeria-track{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
  }
  .colecao-galeria-track::-webkit-scrollbar{ display:none; }
  .colecao-galeria-slide{
    flex:0 0 100%;
    scroll-snap-align:center;
    aspect-ratio:1/1;
    background:var(--placeholder-bg);
  }
  .colecao-galeria-slide img{ width:100%; height:100%; object-fit:cover; display:block; }
  .colecao-galeria-dots{ display:flex; justify-content:center; gap:6px; margin-top:12px; }
  .colecao-galeria-dots span{ width:6px; height:6px; border-radius:50%; background:var(--sage); }
  .colecao-galeria-dots span.ativo{ background:var(--green); }

  /* ===== HERO DA COLEÇÃO ===== */
  .colecao-hero{
    text-align:center;
    padding:48px 6% 36px;
    background:var(--sage);
  }

  .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
  }

  .colecao-hero h1{
    font-size:26px;
    font-weight:400;
    color:var(--green);
    margin-bottom:14px;
  }

  .colecao-hero p{
    font-size:13px;
    line-height:1.8;
    color:var(--teal-muted);
    max-width:520px;
    margin:0 auto;
  }

  .colecao-intro p{
    line-height:1.65;
    margin:0 auto 12px;
  }
  .colecao-intro p:last-child{ margin-bottom:0; }

  /* ===== PEÇAS ===== */
  .pecas-lista{
    max-width:560px;
    margin:0 auto;
    padding:36px 5% 70px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }

  .peca-vazio, .peca-erro{
    text-align:center;
    color:var(--teal-muted);
    font-size:13px;
    padding:60px 0;
  }

  .peca-bloco{
    display:flex;
    flex-direction:column;
    padding:28px 22px 26px;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:4px;
    box-shadow:0 2px 14px rgba(20,45,41,0.06);
  }

  /* ===== Texto da peça ===== */
  .peca-texto{ margin-bottom:22px; }
  .peca-titulo{
    font-family:'Cinzel','Playfair Display',Georgia,serif;
    font-size:26px;
    font-weight:700;
    letter-spacing:2px;
    line-height:1.25;
    color:var(--green);
    padding-bottom:14px;
    margin-bottom:16px;
    position:relative;
  }
  .peca-titulo::after{
    content:'';
    position:absolute;
    left:0; bottom:0;
    width:44px; height:2px;
    background:var(--gold);
  }
  .peca-lead{
    font-family:'Playfair Display',Georgia,serif;
    font-size:18px;
    font-weight:500;
    line-height:1.5;
    color:var(--green-mid);
    margin-bottom:20px;
  }
  .peca-corpo p{
    font-size:15px;
    line-height:1.85;
    color:#3F514D;
    margin:0 0 16px;
    font-style:normal;
  }
  .peca-corpo strong, .peca-lead strong, .peca-fecho strong{ font-weight:700; color:var(--green); }
  .peca-fecho{
    font-family:'Playfair Display',Georgia,serif;
    font-size:16px;
    line-height:1.7;
    color:var(--green);
    border-left:2px solid var(--gold);
    padding:2px 0 2px 16px;
    margin:22px 0 4px;
  }

  .peca-media{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:var(--placeholder-bg);
    overflow:hidden;
  }

  .peca-track{
    display:flex;
    width:100%;
    height:100%;
    transition:transform .3s ease;
  }

  .peca-slide{
    width:100%;
    height:100%;
    flex-shrink:0;
  }

  .peca-slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .peca-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:28px;
    height:28px;
    border-radius:50%;
    background:rgba(255,255,255,0.85);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    line-height:1;
    color:var(--green);
    cursor:pointer;
    padding:0;
    z-index:2;
  }

  .peca-arrow.prev{left:10px;}
  .peca-arrow.next{right:10px;}

  .peca-dots{
    position:absolute;
    bottom:12px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:5px;
    z-index:2;
  }

  .peca-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:rgba(255,255,255,0.75);
  }

  .peca-dot.active{
    background:var(--gold);
  }

  .peca-desc strong{ font-weight:700; color:var(--green); }
  .peca-desc{
    white-space:pre-line;
    margin-top:6px;
    padding:18px 2px 16px;
    border-top:1px solid var(--border);
    font-size:14px;
    line-height:1.85;
    color:var(--teal-muted);
  }

  .btn-partilhar{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
    padding:10px 18px;
    background:none;
    border:1px solid var(--border);
    color:var(--green-mid);
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    font-family:inherit;
  }
  .btn-partilhar:active{ background:var(--off-white); }
  .colecao-hero .btn-partilhar{ margin-top:18px; }

  .peca-btn{
    display:inline-block;
    align-self:flex-start;
    padding:13px 30px;
    background:var(--green);
    color:var(--white);
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-top:4px;
  }

  /* ===== FOOTER (mesma identidade da loja) ===== */
  footer{
    padding:32px 5% 24px;
    border-top:1px solid var(--border);
  }

  .footer-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    margin-bottom:28px;
  }

  .footer-link{
    font-size:12px;
    color:var(--teal-muted);
  }

  .social-icons{
    display:flex;
    gap:10px;
  }

  .social-icon{
    width:24px;
    height:24px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:var(--green-mid);
  }

  .social-icon svg{
    width:12px;
    height:12px;
  }

  .copyright{
    text-align:center;
    font-size:12px;
    color:var(--teal-muted);
    padding-top:20px;
    border-top:1px solid var(--border);
  }

</style>

<script>
  // Texto livre: escapa HTML, converte **frase** em negrito (quebras de linha via CSS pre-line)
  function formatarTexto(txt){
    return String(txt == null ? '' : txt)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*([^*\n]+?)\*\*/g,'<strong>$1</strong>');
  }

  // Estrutura o texto da peça: título, frase de abertura, corpo e frase final
  function formatarIntroPeca(txt){
    const paras = String(txt == null ? '' : txt).replace(/\r/g,'').trim().split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    if(!paras.length) return '';
    const plano = p => p.replace(/\*\*/g,'');
    const fmt = p => formatarTexto(p).replace(/\n/g,'<br>');
    let i = 0, html = '';
    if(paras.length > 1 && plano(paras[0]).length <= 40){ html += `<div class="peca-titulo">${fmt(paras[0])}</div>`; i = 1; }
    if(i === 1 && paras.length - i >= 2 && plano(paras[i]).length <= 90){ html += `<div class="peca-lead">${fmt(paras[i])}</div>`; i++; }
    let corpo = paras.slice(i);
    let fecho = '';
    if(corpo.length >= 3){ fecho = corpo.pop(); }
    html += `<div class="peca-corpo">${corpo.map(p => `<p>${fmt(p)}</p>`).join('')}</div>`;
    if(fecho) html += `<div class="peca-fecho">${fmt(fecho)}</div>`;
    return html;
  }

  // ─── Partilha (WhatsApp / menu de partilha do telemóvel) ───
  const SITE_BASE = 'https://maculuve12.github.io/Royalty-Maculuve-Store-/';
  let colecaoAtual = null;
  function resumoCurto(txt, max){
    let t = String(txt || '').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();
    if(t.length > max){ t = t.slice(0, max).replace(/\s+\S*$/, '') + '…'; }
    return t;
  }
  function partilhar(titulo, texto, url){
    if(navigator.share){
      navigator.share({ title: titulo, text: texto, url: url }).catch(() => {});
    }else{
      window.open('https://wa.me/?text=' + encodeURIComponent(texto + '\n' + url), '_blank');
    }
  }
  function partilharColecao(){
    if(!colecaoAtual) return;
    const nome = String(colecaoAtual.nome).replace(/\*\*/g,'');
    partilhar(nome + ' | ROYALTY', nome + ' — ' + resumoCurto(colecaoAtual.descricao, 110), SITE_BASE + 'c/' + colecaoAtual.id + '.html');
  }
  function partilharPeca(titulo){
    if(!colecaoAtual) return;
    const nome = String(colecaoAtual.nome).replace(/\*\*/g,'');
    partilhar(titulo + ' | ' + nome, titulo + ' — ' + nome + ', da ROYALTY. Descubra a história desta peça.', SITE_BASE + 'c/' + colecaoAtual.id + '.html');
  }

  const SB_URL = 'https://zrcnwkrvfkykqnhwoklh.supabase.co';
  const SB_KEY = 'sb_publishable_PX2HcOTmRmbHLDOT5YuKjg_KBNB6aZc';

  const pecaImgs = {};

  // Galeria da coleção: capa + imagens adicionais (só aparece se houver imagens adicionais)
  function montarGaleriaColecao(colecao){
    const extras = Array.isArray(colecao.imagens) ? colecao.imagens.filter(Boolean) : [];
    if(!extras.length) return;
    const imgs = [colecao.imagem_capa, ...extras].filter(Boolean);
    if(imgs.length < 2 && !imgs.length) return;
    const box = document.getElementById('colecao-galeria');
    box.innerHTML = `
      <div class="colecao-galeria-track" id="colecao-galeria-track">
        ${imgs.map(u => `<div class="colecao-galeria-slide"><img src="${u}" alt="${colecao.nome}" loading="lazy"></div>`).join('')}
      </div>
      ${imgs.length > 1 ? `<div class="colecao-galeria-dots" id="colecao-galeria-dots">${imgs.map((_,i) => `<span class="${i===0?'ativo':''}"></span>`).join('')}</div>` : ''}`;
    box.style.display = 'block';
    const track = document.getElementById('colecao-galeria-track');
    const dots = document.querySelectorAll('#colecao-galeria-dots span');
    track.addEventListener('scroll', () => {
      const i = Math.round(track.scrollLeft / track.clientWidth);
      dots.forEach((d,k) => d.classList.toggle('ativo', k === i));
    }, {passive:true});
  }

  async function carregarColecao(){
    const id = new URLSearchParams(window.location.search).get('id');
    const listaEl = document.getElementById('pecas-lista');
    if(!id){
      document.getElementById('colecao-nome').textContent = 'Coleção não encontrada';
      listaEl.innerHTML = '<p class="peca-erro">Falta indicar qual coleção mostrar.</p>';
      return;
    }

    try{
      const hdr = {'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
      let colData = await fetch(`${SB_URL}/rest/v1/colecoes?id=eq.${id}&select=id,nome,descricao,imagem_capa,imagens`, {headers:hdr}).then(r => r.json()).catch(() => null);
      if(!Array.isArray(colData)){
        // coluna 'imagens' ainda não existe: tenta sem ela
        colData = await fetch(`${SB_URL}/rest/v1/colecoes?id=eq.${id}&select=id,nome,descricao,imagem_capa`, {headers:hdr}).then(r => r.json());
      }

      if(!colData || !colData.length){
        document.getElementById('colecao-nome').textContent = 'Coleção não encontrada';
        listaEl.innerHTML = '<p class="peca-erro">Esta coleção já não está disponível.</p>';
        return;
      }
      const colecao = colData[0];
      document.title = `${String(colecao.nome).replace(/\*\*/g,'')} | Royalty`;
      document.getElementById('colecao-nome').textContent = String(colecao.nome).replace(/\*\*/g,'');
      document.getElementById('colecao-intro').innerHTML = String(colecao.descricao || '').replace(/\r/g,'').trim()
        .split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
        .map(p => `<p>${formatarTexto(p).replace(/\n/g,'<br>')}</p>`).join('');
      montarGaleriaColecao(colecao);
      colecaoAtual = colecao;
      document.getElementById('btn-partilhar-colecao').style.display = 'inline-flex';

      const pecas = await fetch(`${SB_URL}/rest/v1/colecoes_pecas?colecao_id=eq.${id}&order=ordem.asc&select=id,intro,imagens,descricao,produto_id`, {
        headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
      }).then(r => r.json());

      if(!pecas || !pecas.length){
        listaEl.innerHTML = '<p class="peca-vazio">Ainda não há peças nesta coleção.</p>';
        return;
      }

      const idsProdutos = [...new Set(pecas.map(p => p.produto_id).filter(Boolean))];
      let produtosPorId = {};
      if(idsProdutos.length){
        const prods = await fetch(`${SB_URL}/rest/v1/produtos?id=in.(${idsProdutos.join(',')})&select=id,nome,preco`, {
          headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
        }).then(r => r.json()).catch(() => []);
        (prods||[]).forEach(p => { produtosPorId[p.id] = p; });
      }

      listaEl.innerHTML = pecas.map(peca => {
        const imgs = Array.isArray(peca.imagens) ? peca.imagens : [];
        pecaImgs[peca.id] = imgs;
        const produto = produtosPorId[peca.produto_id];
        const label = produto ? `Comprar — ${produto.nome}` : 'Comprar';
        const link = peca.produto_id ? `loja.html?produto=${peca.produto_id}` : 'loja.html';
        const primeiraLinha = String(peca.intro || '').replace(/\*\*/g,'').split(/\n/)[0].trim();
        const tituloPeca = (primeiraLinha && primeiraLinha.length <= 40) ? primeiraLinha : (produto ? produto.nome : 'Peça da coleção');
        const tituloPecaAttr = tituloPeca.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
        return `
          <div class="peca-bloco">
            ${peca.intro ? `<div class="peca-texto">${formatarIntroPeca(peca.intro)}</div>` : ''}
            <div class="peca-media" id="peca-media-${peca.id}">
              <div class="peca-track" id="peca-track-${peca.id}">
                ${imgs.map(img => `<div class="peca-slide"><img src="${img}" alt="${produto ? produto.nome : 'Peça da coleção'}" loading="lazy"></div>`).join('')}
              </div>
              ${imgs.length > 1 ? `
                <button class="peca-arrow prev" onclick="pecaPrev(${peca.id})">&#8249;</button>
                <button class="peca-arrow next" onclick="pecaNext(${peca.id})">&#8250;</button>
                <div class="peca-dots" id="peca-dots-${peca.id}">
                  ${imgs.map((_, i) => `<span class="peca-dot ${i === 0 ? 'active' : ''}"></span>`).join('')}
                </div>
              ` : ''}
            </div>
            ${peca.descricao ? `<div class="peca-desc">${formatarTexto(peca.descricao)}</div>` : ''}
            <a class="peca-btn" href="${link}">${label}</a>
            <button class="btn-partilhar" data-titulo="${tituloPecaAttr}" onclick="partilharPeca(this.dataset.titulo)">↗ Partilhar esta peça</button>
          </div>
        `;
      }).join('');

      pecas.forEach(peca => {
        const media = document.getElementById(`peca-media-${peca.id}`);
        if(!media || !pecaImgs[peca.id] || pecaImgs[peca.id].length <= 1) return;
        let startX = 0;
        media.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive:true });
        media.addEventListener('touchend', e => {
          const diff = e.changedTouches[0].clientX - startX;
          if(Math.abs(diff) > 40){ diff < 0 ? pecaNext(peca.id) : pecaPrev(peca.id); }
        }, { passive:true });
      });
    }catch(e){
      console.error('Erro ao carregar a coleção:', e);
      listaEl.innerHTML = '<p class="peca-erro">Não foi possível carregar esta coleção.</p>';
    }
  }

  function moverPecaSlide(id, idx){
    const imgs = pecaImgs[id];
    if(!imgs || imgs.length <= 1) return;
    if(idx >= imgs.length) idx = 0;
    if(idx < 0) idx = imgs.length - 1;
    const track = document.getElementById(`peca-track-${id}`);
    if(track) track.style.transform = `translateX(-${idx * 100}%)`;
    document.querySelectorAll(`#peca-dots-${id} .peca-dot`).forEach((d, i) => d.classList.toggle('active', i === idx));
    if(track) track.dataset.idx = idx;
  }

  function pecaNext(id){
    const track = document.getElementById(`peca-track-${id}`);
    const atual = track ? Number(track.dataset.idx || 0) : 0;
    moverPecaSlide(id, atual + 1);
  }
  function pecaPrev(id){
    const track = document.getElementById(`peca-track-${id}`);
    const atual = track ? Number(track.dataset.idx || 0) : 0;
    moverPecaSlide(id, atual - 1);
  }

  function marcarLinkActivo(){
    const pagina = document.body.dataset.page || '';
    document.querySelectorAll('.main-nav a').forEach(a => {
      a.classList.toggle('active', a.dataset.page === pagina);
    });
  }

  marcarLinkActivo();
  carregarColecao();
</script>
