<style>
  :root{
    --white:#FFFFFF;
    --green:#142D29;
    --gold:#C8A060;
    --border:#E4E4E4;
    --placeholder-bg:#FAFAFA;
    /* tons de apoio, para suavizar e variar sem sair da identidade */
    --green-mid:#2A5049;
    --green-soft:#3D7068;
    --teal-muted:#5A7570;
    --sage:#CCDDD9;
    --off-white:#F8FAF9;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
    background:var(--white);
    color:var(--green);
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}

  /* ===== HEADER (mesma identidade da loja) ===== */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 5%;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    gap:16px;
  }

  nav.main-nav ul{
    display:flex;
    list-style:none;
    gap:28px;
  }

  nav.main-nav a{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:600;
    color:var(--green);
    padding-bottom:4px;
    border-bottom:2px solid transparent;
  }

  nav.main-nav a.active{
    border-bottom-color:var(--gold);
  }

  .header-row2{
    display:flex;
    align-items:center;
    gap:24px;
  }

  .logo{
    font-size:22px;
    font-weight:700;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--green);
  }

  .header-icons{
    display:flex;
    align-items:center;
    gap:20px;
  }

  .header-icons .icon{
    width:20px;
    height:20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  .icon-right-group{
    display:contents;
  }

  .icon-search{order:1;}
  .icon-account{order:2;}
  .cart-count{order:3;}

  .cart-count{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }

  .cart-count .badge{
    background:var(--gold);
    color:var(--white);
    font-size:10px;
    width:16px;
    height:16px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  @media (max-width:600px){
    header{padding:16px 4%;gap:10px;}
    nav.main-nav{width:100%;}
    nav.main-nav ul{gap:20px;width:100%;justify-content:center;}
    nav.main-nav a{font-size:7px;letter-spacing:0.2px;padding-bottom:5px;}
    .header-row2{
      position:relative;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .logo{
      font-size:16px;
      letter-spacing:2px;
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
    }
    .header-icons{display:contents;}
    .icon-account{order:1;}
    .icon-right-group{display:flex;align-items:center;gap:14px;order:2;}
  }

  /* ===== HERO "A Nossa História" ===== */
  .sobre-hero{
    background:linear-gradient(160deg, var(--green) 0%, var(--green-mid) 100%);
    color:var(--white);
    text-align:center;
    padding:96px 6% 80px;
  }

  .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.24em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:16px;
  }

  .sobre-hero h1{
    font-size:clamp(2.2rem, 7vw, 4.2rem);
    font-weight:800;
    line-height:0.98;
    letter-spacing:0.01em;
    max-width:680px;
    margin:0 auto 20px;
  }

  .sobre-hero h1 em{
    font-style:italic;
    font-weight:700;
    color:var(--gold);
  }

  .sobre-hero .subtitle{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#a9b8b5;
  }

  @media (max-width:600px){
    .sobre-hero{padding:64px 6% 52px;}
  }

  /* ===== CORPO ===== */
  .sobre-body{
    max-width:640px;
    margin:0 auto;
    padding:60px 6% 80px;
  }

  .sobre-lista{
    display:flex;
    flex-direction:column;
    gap:32px;
  }

  .sobre-blk h3{
    font-size:15px;
    font-weight:800;
    letter-spacing:0.02em;
    color:var(--green);
    margin-bottom:14px;
  }

  .sobre-blk p{
    font-size:13px;
    line-height:1.8;
    color:var(--teal-muted);
  }

  .sobre-quote{
    background:var(--sage);
    border-left:3px solid var(--gold);
    padding:20px 24px;
    border-radius:0 10px 10px 0;
  }

  .sobre-quote blockquote{
    font-size:17px;
    font-style:italic;
    line-height:1.6;
    color:var(--green);
    margin-bottom:10px;
  }

  .sobre-quote cite{
    font-size:11px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--green-mid);
    font-style:normal;
  }

  /* ===== FOOTER (mesma identidade da loja) ===== */
  footer{
    padding:32px 5% 24px;
    border-top:1px solid var(--border);
  }

  .footer-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    margin-bottom:28px;
  }

  .footer-link{
    font-size:12px;
    color:var(--teal-muted);
  }

  .social-icons{
    display:flex;
    gap:10px;
  }

  .social-icon{
    width:24px;
    height:24px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:var(--green-mid);
  }

  .social-icon svg{
    width:12px;
    height:12px;
  }

  .copyright{
    text-align:center;
    font-size:12px;
    color:var(--teal-muted);
    padding-top:20px;
    border-top:1px solid var(--border);
  }

</style>

<script>
  // ─── Navegação: destaca sempre o link da página actual ───
  function marcarLinkActivo(){
    const pagina = document.body.dataset.page || '';
    document.querySelectorAll('.main-nav a').forEach(a => {
      a.classList.toggle('active', a.dataset.page === pagina);
    });
  }
  marcarLinkActivo();

  // ─── Texto "Sobre Nós" (blocos editáveis no ADM) ───
  const SB_URL = 'https://zrcnwkrvfkykqnhwoklh.supabase.co';
  const SB_KEY = 'sb_publishable_PX2HcOTmRmbHLDOT5YuKjg_KBNB6aZc';

  function escaparHtml(texto){
    const div = document.createElement('div');
    div.textContent = texto;
    return div.innerHTML;
  }

  function formatarNegrito(texto){
    return escaparHtml(texto || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  }

  function carregarSobreNosPublico(){
    const lista = document.getElementById('sobre-lista');
    fetch(`${SB_URL}/rest/v1/sobre_blocos?order=ordem.asc&select=tipo,titulo,texto,autor`, {
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
    })
    .then(r => r.json())
    .then(data => {
      if(!data || !data.length) return;
      lista.innerHTML = data.map(b => {
        if(b.tipo === 'citacao'){
          return `
            <div class="sobre-quote">
              <blockquote>"${formatarNegrito(b.texto)}"</blockquote>
              ${b.autor ? `<cite>${escaparHtml(b.autor)}</cite>` : ''}
            </div>
          `;
        }
        return `
          <div class="sobre-blk">
            ${b.titulo ? `<h3>${escaparHtml(b.titulo)}</h3>` : ''}
            <p>${formatarNegrito(b.texto)}</p>
          </div>
        `;
      }).join('');
    })
    .catch(() => {});
  }
  carregarSobreNosPublico();
</script>
