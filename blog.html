<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | Royalty</title>
<style>
  :root{
    --white:#FFFFFF;
    --green:#142D29;
    --gold:#C8A060;
    --border:#E4E4E4;
    --placeholder-bg:#FAFAFA;
    /* tons de apoio, para suavizar e variar sem sair da identidade */
    --green-mid:#2A5049;
    --green-soft:#3D7068;
    --teal-muted:#5A7570;
    --sage:#CCDDD9;
    --off-white:#F8FAF9;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background:var(--white);
    color:var(--green);
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}

  /* ===== HEADER ===== */
  header{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    height:64px;
    padding:0 3%;
    border-bottom:1px solid var(--border);
    background:var(--white);
  }
  .topo-esq{ display:flex; align-items:center; gap:2px; justify-self:start; }
  .topo-dir{ display:flex; align-items:center; gap:2px; justify-self:end; }
  .topo-btn{
    position:relative;
    width:42px;
    height:42px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:0;
    padding:0;
    cursor:pointer;
    color:var(--green);
  }
  .topo-btn svg{
    width:23px;
    height:23px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.6;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .logo{
    font-size:20px;
    font-weight:700;
    letter-spacing:5px;
    padding-left:5px;
    color:var(--green);
    text-align:center;
    white-space:nowrap;
  }
  .cart-count .badge{
    position:absolute;
    top:2px;
    right:0;
    min-width:17px;
    height:17px;
    padding:0 4px;
    border-radius:9px;
    background:var(--gold);
    color:var(--white);
    font-size:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  @media (max-width:600px){
    .logo{ font-size:17px; letter-spacing:3.5px; padding-left:3.5px; }
  }

  /* ===== MENU LATERAL ===== */
  .menu-fundo{
    position:fixed;
    inset:0;
    background:rgba(20,45,41,0.45);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:690;
  }
  .menu-fundo.open{ opacity:1; pointer-events:auto; }
  .menu-gaveta{
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    width:min(84%, 340px);
    background:var(--white);
    transform:translateX(-100%);
    transition:transform .28s ease;
    z-index:700;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  .menu-gaveta.open{ transform:translateX(0); }
  .menu-topo{ display:flex; justify-content:flex-end; padding:14px 14px 6px; }
  .menu-fechar{
    width:42px;
    height:42px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:0;
    padding:0;
    cursor:pointer;
    color:var(--green);
  }
  .menu-fechar svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; }
  .menu-lista{ display:flex; flex-direction:column; padding:8px 0 40px; }
  .menu-lista > a, .menu-item-botao{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:17px 30px;
    background:none;
    border:0;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--green);
    text-align:left;
    cursor:pointer;
  }
  .menu-lista > a.active{ box-shadow:inset 2px 0 0 var(--gold); }
  .menu-item-botao svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s ease; }
  .menu-grupo.aberto .menu-item-botao svg{ transform:rotate(180deg); }
  .menu-sub{ display:none; flex-direction:column; padding-bottom:8px; }
  .menu-grupo.aberto .menu-sub{ display:flex; }
  .menu-sub a{
    padding:12px 30px 12px 46px;
    font-size:13px;
    letter-spacing:1.5px;
    color:var(--teal-muted);
  }

  /* ===== TÍTULO DA PÁGINA ===== */
  .blog-hero{
    text-align:center;
    padding:64px 6% 20px;
    background:var(--white);
  }

  .blog-hero h1{
    font-size:20px;
    font-weight:500;
    letter-spacing:5px;
    text-transform:uppercase;
    color:var(--green);
  }

  /* ===== NOTÍCIAS ===== */
  .blog-feed{
    max-width:640px;
    margin:0 auto;
    padding:8px 5% 72px;
  }

  .blog-empty{
    text-align:center;
    color:var(--teal-muted);
    font-size:13px;
    padding:60px 0;
  }

  .noticia{
    padding:40px 0;
    border-bottom:1px solid var(--border);
  }
  .noticia:last-child{ border-bottom:0; }

  /* fotos: arrastar para o lado, sem cortar */
  .noticia-media{
    position:relative;
    width:100%;
    background:var(--off-white);
  }

  .noticia-slider{
    display:flex;
    gap:6px;
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    cursor:grab;
    overscroll-behavior-x:contain;
  }
  .noticia-slider::-webkit-scrollbar{ display:none; }
  .noticia-slider.arrastando{ cursor:grabbing; scroll-snap-type:none; }

  .noticia-slide{
    flex:0 0 100%;
    scroll-snap-align:start;
    aspect-ratio:var(--prop, 1/1);
    background:var(--off-white);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* com várias fotos, a seguinte espreita à direita */
  .noticia-multi .noticia-slide{ flex-basis:90%; }
  .noticia-multi .noticia-slider{ padding-right:10%; box-sizing:border-box; }

  .noticia-slide img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;
  }

  .noticia-contador{
    position:absolute;
    top:10px;
    right:10px;
    background:var(--green);
    color:var(--white);
    font-size:11px;
    font-weight:600;
    letter-spacing:1px;
    padding:4px 9px;
    border-radius:2px;
    pointer-events:none;
  }

  .noticia-pontos{
    display:flex;
    justify-content:center;
    gap:6px;
    padding-top:14px;
  }

  .noticia-ponto{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--border);
    transition:background .2s ease;
  }
  .noticia-ponto.activo{ background:var(--gold); }

  /* texto */
  .noticia-corpo{ padding-top:22px; }

  .noticia-data{
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:600;
    color:var(--teal-muted);
  }

  .noticia-titulo{
    margin-top:10px;
    font-size:20px;
    line-height:1.35;
    font-weight:600;
    color:var(--green);
  }

  .noticia-titulo{ letter-spacing:0.2px; }

  .noticia-texto{
    margin-top:16px;
    font-size:14.5px;
    line-height:1.7;
    color:var(--teal-muted);
  }

  .noticia-texto p + p{ margin-top:14px; }

  .noticia-texto strong{
    font-weight:700;
    color:var(--green);
  }

  .noticia-texto.recolhido p:not(:first-child){ display:none; }
  .noticia-texto.recolhido p:first-child{
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .noticia-mais{
    margin-top:14px;
    background:none;
    border:0;
    padding:0 0 3px;
    font-family:inherit;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:700;
    color:var(--green);
    border-bottom:1px solid var(--gold);
    cursor:pointer;
  }

  /* ===== FOOTER (mesma identidade da loja) ===== */
  footer{
    padding:32px 5% 24px;
    border-top:1px solid var(--border);
  }

  .footer-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    margin-bottom:28px;
  }

  .footer-link{
    font-size:12px;
    color:var(--teal-muted);
  }

  .social-icons{
    display:flex;
    gap:10px;
  }

  .social-icon{
    width:24px;
    height:24px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:var(--green-mid);
  }

  .social-icon svg{
    width:12px;
    height:12px;
  }

  .copyright{
    text-align:center;
    font-size:12px;
    color:var(--teal-muted);
    padding-top:20px;
    border-top:1px solid var(--border);
  }

  .menu-etiqueta{
    margin-left:10px;
    font-size:10px;
    font-weight:700;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
  }
  .menu-grupo.ativo > .menu-item-botao{ box-shadow:inset 2px 0 0 var(--gold); }
</style>
</head>

<script>
  // ════════════════════════════════════════
  // [FUNÇÕES REAIS DO BLOG] — Adaptadas da galeria.html
  // oficial para o layout deste mockup. Mesma base
  // de dados (Supabase), mesmo feed estilo Facebook.
  // ════════════════════════════════════════
  const SB_URL = 'https://zrcnwkrvfkykqnhwoklh.supabase.co';
  const SB_KEY = 'sb_publishable_PX2HcOTmRmbHLDOT5YuKjg_KBNB6aZc';

  let LOGO_URL = '';
  const postImgs = {};

  function avatarSvg(){
    return `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>`;
  }

  function formatarData(iso){
    if(!iso) return '';
    const d = new Date(iso);
    const agora = new Date();
    const diff = Math.floor((agora - d) / 1000);
    if(diff < 60) return 'Agora mesmo';
    if(diff < 3600) return `${Math.floor(diff/60)} min`;
    if(diff < 86400) return `${Math.floor(diff/3600)}h`;
    if(diff < 604800) return `${Math.floor(diff/86400)}d`;
    return d.toLocaleDateString('pt-PT');
  }

  async function carregarBlog(){
    const feed = document.getElementById('blog-feed');
    if(!feed) return;

    try{
      const [posts, cfg] = await Promise.all([
        fetch(`${SB_URL}/rest/v1/galeria?activo=eq.true&order=criado_em.desc&select=*`, {
          headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
        }).then(r => r.json()),
        fetch(`${SB_URL}/rest/v1/configuracoes?chave=eq.logo_galeria&select=valor`, {
          headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
        }).then(r => r.json()).catch(() => [])
      ]);

      if(cfg && cfg[0] && cfg[0].valor) LOGO_URL = cfg[0].valor;

      if(!posts || !posts.length){
        feed.innerHTML = '<p class="blog-empty">Sem publicações ainda.</p>';
        return;
      }

      feed.innerHTML = posts.map(p => {
        const imgs = (p.imagens && p.imagens.length) ? p.imagens : (p.imagem_url ? [p.imagem_url] : []);
        postImgs[p.id] = imgs;
        const varias = imgs.length > 1;

        // primeira linha da descrição = título; o resto = texto
        const linhas = (p.descricao || '').split(/\n|<br\s*\/?>/i).map(l => l.trim());
        while(linhas.length && !linhas[0]) linhas.shift();
        let titulo = '', resto = linhas;
        if(linhas.length && linhas[0].length <= 110){
          titulo = linhas[0].replace(/\*\*/g, '').replace(/[.\s]+$/, '');
          resto = linhas.slice(1);
        }
        // **palavra** = negrito; linhas seguidas formam um parágrafo, linha em branco separa parágrafos
        const negrito = t => t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        const paragrafos = [];
        let atual = [];
        resto.forEach(l => {
          if(l){ atual.push(negrito(l)); }
          else if(atual.length){ paragrafos.push(atual); atual = []; }
        });
        if(atual.length) paragrafos.push(atual);
        const texto = paragrafos.map(g => `<p>${g.join('<br>')}</p>`).join('');

        return `
        <article class="noticia">
          ${imgs.length ? `
          <div class="noticia-media ${varias ? 'noticia-multi' : ''}">
            <div class="noticia-slider" id="blog-slider-${p.id}">
              ${imgs.map(img => `<div class="noticia-slide"><img src="${img}" alt="${titulo.replace(/"/g, '&quot;') || 'Royalty'}" draggable="false" loading="lazy"></div>`).join('')}
            </div>
            ${varias ? `<div class="noticia-contador" id="blog-cont-${p.id}">1 / ${imgs.length}</div>` : ''}
          </div>
          ${varias ? `<div class="noticia-pontos" id="blog-dots-${p.id}">${imgs.map((_, i) => `<span class="noticia-ponto ${i === 0 ? 'activo' : ''}"></span>`).join('')}</div>` : ''}
          ` : ''}
          <div class="noticia-corpo">
            <div class="noticia-data">${formatarData(p.criado_em)}</div>
            ${titulo ? `<h2 class="noticia-titulo">${titulo}</h2>` : ''}
            ${texto ? `<div class="noticia-texto recolhido" id="blog-texto-${p.id}">${texto}</div>
            <button class="noticia-mais" id="blog-mais-${p.id}" onclick="alternarTexto(${p.id})">Ler mais</button>` : ''}
          </div>
        </article>`;
      }).join('');

      iniciarSliders(posts);
      posts.forEach(p => {
        const t = document.getElementById(`blog-texto-${p.id}`);
        const m = document.getElementById(`blog-mais-${p.id}`);
        if(t && m){
          const primeiro = t.querySelector('p');
          const cabe = t.querySelectorAll('p').length < 2 && primeiro.scrollHeight <= primeiro.clientHeight + 2;
          if(cabe){ t.classList.remove('recolhido'); m.style.display = 'none'; }
        }
      });
    }catch(e){
      feed.innerHTML = '<p class="blog-empty">Não foi possível carregar as publicações.</p>';
    }
  }

  function alternarTexto(id){
    const t = document.getElementById(`blog-texto-${id}`);
    const m = document.getElementById(`blog-mais-${id}`);
    const fechado = t.classList.toggle('recolhido');
    m.textContent = fechado ? 'Ler mais' : 'Ler menos';
  }

  // ─── Fotos: arrastar, sem cortar, com contador e pontos ───
  function iniciarSliders(posts){
    posts.forEach(p => {
      const slider = document.getElementById(`blog-slider-${p.id}`);
      if(!slider) return;
      const total = (postImgs[p.id] || []).length;

      // altura segue a proporção da 1.ª foto (entre 4:5 e 3:2); nenhuma foto é cortada
      const primeira = slider.querySelector('img');
      const ajustar = () => {
        if(!primeira.naturalWidth) return;
        let r = primeira.naturalWidth / primeira.naturalHeight;
        r = Math.min(1.5, Math.max(0.8, r));
        slider.style.setProperty('--prop', r.toFixed(3));
      };
      if(primeira.complete) ajustar(); else primeira.addEventListener('load', ajustar);

      if(total < 2) return;

      const cont = document.getElementById(`blog-cont-${p.id}`);
      const pontos = document.querySelectorAll(`#blog-dots-${p.id} .noticia-ponto`);
      const passo = () => {
        const sl = slider.querySelectorAll('.noticia-slide');
        return sl[1].offsetLeft - sl[0].offsetLeft;
      };
      const actualizar = () => {
        let idx = Math.round(slider.scrollLeft / passo());
        if(slider.scrollLeft >= slider.scrollWidth - slider.clientWidth - 2) idx = total - 1;
        idx = Math.max(0, Math.min(total - 1, idx));
        if(cont) cont.textContent = `${idx + 1} / ${total}`;
        pontos.forEach((d, i) => d.classList.toggle('activo', i === idx));
      };
      slider.addEventListener('scroll', actualizar, { passive:true });

      // rato no computador; no telemóvel o toque já arrasta nativamente
      let down = false, x0 = 0, s0 = 0;
      slider.addEventListener('pointerdown', e => {
        if(e.pointerType !== 'mouse') return;
        down = true; x0 = e.clientX; s0 = slider.scrollLeft;
      });
      window.addEventListener('pointermove', e => {
        if(!down) return;
        const dx = e.clientX - x0;
        if(Math.abs(dx) > 4) slider.classList.add('arrastando');
        slider.scrollLeft = s0 - dx;
      });
      window.addEventListener('pointerup', () => {
        if(!down) return;
        down = false;
        slider.classList.remove('arrastando');
        slider.scrollTo({ left: Math.round(slider.scrollLeft / passo()) * passo(), behavior:'smooth' });
      });
    });
  }

  // ─── Navegação: destaca sempre o link da página actual ───
  function marcarLinkActivo(){
    const pagina = document.body.dataset.page || '';
    document.querySelectorAll('.menu-lista > a[data-page]').forEach(a => {
      a.classList.toggle('active', a.dataset.page === pagina);
    });
  }

  // ─── Menu lateral ───
  function abrirMenu(){
    document.getElementById('menu-fundo').classList.add('open');
    document.getElementById('menu-gaveta').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function fecharMenu(){
    document.getElementById('menu-fundo').classList.remove('open');
    document.getElementById('menu-gaveta').classList.remove('open');
    document.body.style.overflow = '';
  }
  function alternarCategoriasMenu(){
    document.getElementById('menu-categorias').classList.toggle('aberto');
  }
  document.addEventListener('keydown', e => { if(e.key === 'Escape') fecharMenu(); });

  // Categorias no menu: só as que têm pelo menos uma peça
  function alternarGrupoMenu(id){
    document.getElementById(id).classList.toggle('aberto');
  }

  // Coleções no menu: todas as que têm peças, e as "em breve" no fim
  async function carregarMenuColecoes(){
    const grupo = document.getElementById('menu-colecoes');
    if(!grupo) return;
    const hdr = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
    const esc = t => String(t).replace(/\*\*/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
    try{
      const [cols, pecas, stats] = await Promise.all([
        fetch(`${SB_URL}/rest/v1/colecoes?order=ordem.asc&select=id,nome,estado`, { headers: hdr }).then(r => r.json()),
        fetch(`${SB_URL}/rest/v1/colecoes_pecas?select=colecao_id,produto_id`, { headers: hdr }).then(r => r.json()),
        fetch(`${SB_URL}/rest/v1/estatisticas_produtos?select=produto_id,total_vendas`, { headers: hdr }).then(r => r.json()).catch(() => [])
      ]);
      if(!Array.isArray(cols) || !Array.isArray(pecas)) return;
      const comPecas = new Set(pecas.map(p => p.colecao_id));

      // coleção mais vendida = soma das vendas dos produtos das suas peças
      const vendasProduto = {};
      (Array.isArray(stats) ? stats : []).forEach(x => { vendasProduto[x.produto_id] = (vendasProduto[x.produto_id] || 0) + (x.total_vendas || 0); });
      const produtosDaColecao = {};
      pecas.forEach(p => { if(p.produto_id) (produtosDaColecao[p.colecao_id] = produtosDaColecao[p.colecao_id] || new Set()).add(p.produto_id); });
      let melhorId = null, melhorTotal = 0;
      Object.keys(produtosDaColecao).forEach(cid => {
        let total = 0;
        produtosDaColecao[cid].forEach(pid => { total += vendasProduto[pid] || 0; });
        if(total > melhorTotal){ melhorTotal = total; melhorId = Number(cid); }
      });

      const disponiveis = cols.filter(c => c.estado !== 'em_breve' && comPecas.has(c.id));
      const emBreve = cols.filter(c => c.estado === 'em_breve');
      const lista = [...disponiveis, ...emBreve];
      if(!lista.length) return;
      document.getElementById('menu-sub-colecoes').innerHTML = lista.map(c =>
        `<a href="colecao.html?id=${c.id}">${esc(c.nome)}${c.estado === 'em_breve' ? '<span class="menu-etiqueta">Em breve</span>' : (c.id === melhorId ? '<span class="menu-etiqueta">Mais vendida</span>' : '')}</a>`
      ).join('');
      grupo.style.display = 'block';
      if(/colecao\.html$/i.test(location.pathname)) grupo.classList.add('ativo', 'aberto');
    }catch(e){}
  }

  async function carregarMenuCategorias(){
    const grupo = document.getElementById('menu-categorias');
    if(!grupo) return;
    const hdr = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };
    const esc = t => String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    try{
      const [cats, prods] = await Promise.all([
        fetch(`${SB_URL}/rest/v1/categorias?order=ordem.asc&select=nome`, { headers: hdr }).then(r => r.json()),
        fetch(`${SB_URL}/rest/v1/produtos?activo=eq.true&select=categoria`, { headers: hdr }).then(r => r.json())
      ]);
      if(!Array.isArray(cats) || !Array.isArray(prods)) return;
      const comPecas = new Set(prods.map(p => p.categoria).filter(Boolean));
      const lista = cats.filter(c => comPecas.has(c.nome));
      if(!lista.length) return;
      document.getElementById('menu-sub').innerHTML =
        '<a href="loja.html">Todas as peças</a>' +
        lista.map(c => `<a href="loja.html?categoria=${encodeURIComponent(c.nome)}">${esc(c.nome)}</a>`).join('');
      grupo.style.display = 'block';
    }catch(e){}
  }

  // Número de peças no carrinho (guardado pela loja)
  function atualizarBadgeCarrinho(){
    try{
      const c = JSON.parse(localStorage.getItem('royalty_carrinho') || '[]');
      const n = c.reduce((acc, i) => acc + (Number(i.qtd) || 0), 0);
      const b = document.getElementById('cart-badge');
      if(b) b.textContent = n;
    }catch(e){}
  }

  marcarLinkActivo();
  carregarBlog();

  carregarMenuCategorias();
  carregarMenuColecoes();
  atualizarBadgeCarrinho();
</script>
