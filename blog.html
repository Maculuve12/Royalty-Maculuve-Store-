<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | Royalty</title>
<style>
  :root{
    --white:#FFFFFF;
    --green:#142D29;
    --gold:#C8A060;
    --border:#E4E4E4;
    --placeholder-bg:#FAFAFA;
    /* tons de apoio, para suavizar e variar sem sair da identidade */
    --green-mid:#2A5049;
    --green-soft:#3D7068;
    --teal-muted:#5A7570;
    --sage:#CCDDD9;
    --off-white:#F8FAF9;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background:var(--white);
    color:var(--green);
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;text-decoration:none;}

  /* ===== HEADER (mesma identidade da loja) ===== */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 5%;
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    gap:16px;
  }

  nav.main-nav ul{
    display:flex;
    list-style:none;
    gap:28px;
  }

  nav.main-nav a{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:600;
    color:var(--green);
    padding-bottom:4px;
    border-bottom:2px solid transparent;
  }

  nav.main-nav a.active{
    border-bottom-color:var(--gold);
  }

  .header-row2{
    display:flex;
    align-items:center;
    gap:24px;
  }

  .logo{
    font-size:22px;
    font-weight:700;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--green);
  }

  .header-icons{
    display:flex;
    align-items:center;
    gap:20px;
  }

  .header-icons .icon{
    width:20px;
    height:20px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }

  .icon-right-group{
    display:contents;
  }

  .icon-search{order:1;}
  .icon-account{order:2;}
  .cart-count{order:3;}

  .cart-count{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
  }

  .cart-count .badge{
    background:var(--gold);
    color:var(--white);
    font-size:10px;
    width:16px;
    height:16px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  @media (max-width:600px){
    header{padding:16px 4%;gap:10px;}
    nav.main-nav{width:100%;}
    nav.main-nav ul{gap:20px;width:100%;justify-content:center;}
    nav.main-nav a{font-size:7px;letter-spacing:0.2px;padding-bottom:5px;}
    .header-row2{
      position:relative;
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .logo{
      font-size:16px;
      letter-spacing:2px;
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
    }
    .header-icons{display:contents;}
    .icon-account{order:1;}
    .icon-right-group{display:flex;align-items:center;gap:14px;order:2;}
  }

  /* ===== TÍTULO DA PÁGINA ===== */
  .blog-hero{
    text-align:center;
    padding:44px 6% 32px;
    background:var(--sage);
  }

  .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
  }

  .blog-hero h1{
    font-size:22px;
    font-weight:400;
    color:var(--green);
  }

  /* ===== FEED ===== */
  .blog-feed{
    max-width:560px;
    margin:0 auto;
    padding:32px 5% 70px;
    display:flex;
    flex-direction:column;
    gap:24px;
  }

  .blog-empty{
    text-align:center;
    color:var(--teal-muted);
    font-size:13px;
    padding:60px 0;
  }

  .blog-post{
    background:var(--off-white);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 2px 10px rgba(20,45,41,0.06);
  }

  .blog-post-header{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 16px;
  }

  .blog-post-avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--green-mid);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }

  .blog-post-avatar svg{
    width:20px;
    height:20px;
    fill:var(--white);
  }

  .blog-post-info{
    display:flex;
    flex-direction:column;
  }

  .blog-post-nome{
    font-size:12px;
    font-weight:700;
    color:var(--green);
  }

  .blog-post-data{
    font-size:10px;
    color:var(--teal-muted);
  }

  .blog-post-media{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:var(--placeholder-bg);
    overflow:hidden;
  }

  .blog-post-track{
    display:flex;
    width:100%;
    height:100%;
    transition:transform .3s ease;
  }

  .blog-post-slide{
    width:100%;
    height:100%;
    flex-shrink:0;
  }

  .blog-post-slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .blog-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:24px;
    height:24px;
    border-radius:50%;
    background:rgba(255,255,255,0.85);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    line-height:1;
    color:var(--green);
    cursor:pointer;
    padding:0;
    z-index:2;
  }

  .blog-arrow.prev{left:8px;}
  .blog-arrow.next{right:8px;}

  .blog-dots{
    position:absolute;
    bottom:10px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:5px;
    z-index:2;
  }

  .blog-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:rgba(255,255,255,0.75);
  }

  .blog-dot.active{
    background:var(--gold);
  }

  .blog-post-desc{
    padding:12px 16px 16px;
    font-size:12px;
    line-height:1.6;
    color:var(--teal-muted);
  }

  .blog-post-desc strong{
    color:var(--green);
  }

  /* ===== FOOTER (mesma identidade da loja) ===== */
  footer{
    padding:32px 5% 24px;
    border-top:1px solid var(--border);
  }

  .footer-top{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    margin-bottom:28px;
  }

  .footer-link{
    font-size:12px;
    color:var(--teal-muted);
  }

  .social-icons{
    display:flex;
    gap:10px;
  }

  .social-icon{
    width:24px;
    height:24px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    background:var(--green-mid);
  }

  .social-icon svg{
    width:12px;
    height:12px;
  }

  .copyright{
    text-align:center;
    font-size:12px;
    color:var(--teal-muted);
    padding-top:20px;
    border-top:1px solid var(--border);
  }

</style>

<script>
  // ════════════════════════════════════════
  // [FUNÇÕES REAIS DO BLOG] — Adaptadas da galeria.html
  // oficial para o layout deste mockup. Mesma base
  // de dados (Supabase), mesmo feed estilo Facebook.
  // ════════════════════════════════════════
  const SB_URL = 'https://zrcnwkrvfkykqnhwoklh.supabase.co';
  const SB_KEY = 'sb_publishable_PX2HcOTmRmbHLDOT5YuKjg_KBNB6aZc';

  let LOGO_URL = '';
  const postImgs = {};

  function avatarSvg(){
    return `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>`;
  }

  function formatarData(iso){
    if(!iso) return '';
    const d = new Date(iso);
    const agora = new Date();
    const diff = Math.floor((agora - d) / 1000);
    if(diff < 60) return 'Agora mesmo';
    if(diff < 3600) return `${Math.floor(diff/60)} min`;
    if(diff < 86400) return `${Math.floor(diff/3600)}h`;
    if(diff < 604800) return `${Math.floor(diff/86400)}d`;
    return d.toLocaleDateString('pt-PT');
  }

  async function carregarBlog(){
    const feed = document.getElementById('blog-feed');
    if(!feed) return;

    try{
      const [posts, cfg] = await Promise.all([
        fetch(`${SB_URL}/rest/v1/galeria?activo=eq.true&order=criado_em.desc&select=*`, {
          headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
        }).then(r => r.json()),
        fetch(`${SB_URL}/rest/v1/configuracoes?chave=eq.logo_galeria&select=valor`, {
          headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}
        }).then(r => r.json()).catch(() => [])
      ]);

      if(cfg && cfg[0] && cfg[0].valor) LOGO_URL = cfg[0].valor;

      if(!posts || !posts.length){
        feed.innerHTML = '<p class="blog-empty">Sem publicações ainda.</p>';
        return;
      }

      feed.innerHTML = posts.map(p => {
        const imgs = (p.imagens && p.imagens.length) ? p.imagens : (p.imagem_url ? [p.imagem_url] : []);
        postImgs[p.id] = imgs;

        return `
        <div class="blog-post">
          <div class="blog-post-header">
            <div class="blog-post-avatar">
              ${LOGO_URL ? `<img src="${LOGO_URL}" alt="Royalty Maculuve" style="width:100%;height:100%;object-fit:cover;">` : avatarSvg()}
            </div>
            <div class="blog-post-info">
              <div class="blog-post-nome">Royalty Maculuve</div>
              <div class="blog-post-data">${formatarData(p.criado_em)}</div>
            </div>
          </div>
          <div class="blog-post-media" id="blog-media-${p.id}">
            <div class="blog-post-track" id="blog-track-${p.id}">
              ${imgs.length ? imgs.map(img => `<div class="blog-post-slide"><img src="${img}" alt="Royalty" loading="lazy"></div>`).join('') : ''}
            </div>
            ${imgs.length > 1 ? `
              <button class="blog-arrow prev" onclick="blogPrev(${p.id})">&#8249;</button>
              <button class="blog-arrow next" onclick="blogNext(${p.id})">&#8250;</button>
              <div class="blog-dots" id="blog-dots-${p.id}">
                ${imgs.map((_, i) => `<span class="blog-dot ${i === 0 ? 'active' : ''}"></span>`).join('')}
              </div>
            ` : ''}
          </div>
          ${p.descricao ? `<div class="blog-post-desc"><strong>royalty.maculuve</strong> ${p.descricao}</div>` : ''}
        </div>`;
      }).join('');

      // Suporte a swipe (touch) em cada publicação
      posts.forEach(p => {
        const media = document.getElementById(`blog-media-${p.id}`);
        if(!media || !postImgs[p.id] || postImgs[p.id].length <= 1) return;
        let startX = 0;
        media.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive:true });
        media.addEventListener('touchend', e => {
          const diff = e.changedTouches[0].clientX - startX;
          if(Math.abs(diff) > 40){ diff < 0 ? blogNext(p.id) : blogPrev(p.id); }
        }, { passive:true });
      });
    }catch(e){
      feed.innerHTML = '<p class="blog-empty">Não foi possível carregar as publicações.</p>';
    }
  }

  function moverBlogSlide(id, idx){
    const imgs = postImgs[id];
    if(!imgs || imgs.length <= 1) return;
    if(idx >= imgs.length) idx = 0;
    if(idx < 0) idx = imgs.length - 1;
    const track = document.getElementById(`blog-track-${id}`);
    if(track) track.style.transform = `translateX(-${idx * 100}%)`;
    document.querySelectorAll(`#blog-dots-${id} .blog-dot`).forEach((d, i) => d.classList.toggle('active', i === idx));
    if(track) track.dataset.idx = idx;
  }

  function blogNext(id){
    const track = document.getElementById(`blog-track-${id}`);
    const atual = track ? Number(track.dataset.idx || 0) : 0;
    moverBlogSlide(id, atual + 1);
  }
  function blogPrev(id){
    const track = document.getElementById(`blog-track-${id}`);
    const atual = track ? Number(track.dataset.idx || 0) : 0;
    moverBlogSlide(id, atual - 1);
  }

  // ─── Navegação: destaca sempre o link da página actual ───
  function marcarLinkActivo(){
    const pagina = document.body.dataset.page || '';
    document.querySelectorAll('.main-nav a').forEach(a => {
      a.classList.toggle('active', a.dataset.page === pagina);
    });
  }

  marcarLinkActivo();
  carregarBlog();
</script>
